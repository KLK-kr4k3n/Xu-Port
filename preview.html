      }

      aside {

        font-size: 18px;
        margin-bottom: 36px;
      }

      .navButton {
        align-items: center;
        background: transparent;
        border: 1px solid var(--ink);
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        font-size: 18px;
        gap: 8px;
        margin-bottom: 30px;
        padding: 10px 20px;
        text-decoration: none;
      }

      .navButton.active {
        background: var(--ink);
        color: var(--bg);
      }

      .projectNav {
        display: none;
        gap: 20px;
        grid-auto-rows: 30px;
        list-style: none;
        margin: 10px 0 0;
        max-width: 270px;
        overflow: hidden;
        padding: 0 0 0 6px;
        width: 270px;
      }

      .projectNav.open {
        display: grid;
      }

      .projectNav li {
        align-items: baseline;
        display: flex;
        height: 30px;
        min-width: 0;
        overflow: hidden;
        width: 270px;
      }

      .projectNav li::before {
        color: var(--ink);
        content: "●";
        flex: 0 0 14px;
        font-size: 9px;
        margin-right: 8px;
        text-align: center;
        vertical-align: 0.1em;
      }

      .projectNav a {
        color: var(--ink);
        display: inline-block;
        flex: 0 0 244px;
        font-size: 18px;
        font-style: italic;
        height: 28px;
        line-height: 24px;
        max-width: 244px;
        min-width: 0;
        overflow: hidden;
        padding: 2px 5px;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-overflow: clip;
        white-space: nowrap;

      .projectNav a.active {
        background: var(--ink);
        color: var(--bg);
        font-weight: 400;
        text-decoration: none;
      }

      .langSwitch {
        bottom: 24px;
        display: flex;
        gap: 10px;
        position: absolute;
      }

        border: 0;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
      }

        color: var(--ink);
        text-decoration: underline;

        width: 100%;

        font-size: 16px;
        line-height: 1.22;
        margin: 0 0 18px;

        line-height: 1.25;

      .cvFields {

        line-height: 1.28;
        margin: 0;
      }

      .cvFields p {
        margin: 0 0 28px;
      }

      .projectListSection {
        max-width: 1180px;
      }

      .projectPreviewList {
        display: grid;
        gap: 36px;
        margin-top: 34px;
      }

        background: var(--bg);
        border: 1px solid var(--ink);
        display: block;
        overflow: hidden;
        width: 100%;

        height: 100%;

        object-position: center;
        width: 100%;

        }

        aside {
          height: auto;
          position: relative;
        }

        .langSwitch {
          margin-top: 28px;
          position: static;
        }

        main {
          padding: 32px 22px;
        }

        .projectHeader {
          display: block;
        }

        .projectHeader .pageTitle {
          margin-right: 0;
        }

        .projectAward {
          margin: 0 0 18px;
          max-width: none;
          text-align: left;
        }

        .cvLayout {
          display: block;
          min-height: auto;
          padding-top: 0;
        }

        .cvColumn {
          min-height: auto;
        }

        .cvIntro,
        .cvLower,
        .cvFields {
          margin-left: 0;
        }

        .cvTools {
          margin-top: 90px;
          text-align: left;
        }

        .cvFields {
          margin-top: 100px;
        }
      }

                                              "If the physical rules of the world changed, would human bodies, tools, and societies still exist in their current form?\n\nTopological Regime is an experimental design research project combining parametric morphology generation, human dynamics, design fiction, and XR immersive experience. It begins from a counterfactual question: if humans did not live under Earth's current gravity, atmosphere, terrain, and climate, how would bodily movement, skeletal structure, and bodily systems be reshaped?\n\nThe project treats planetary conditions as generative premises for bodily and structural form. Gravity, atmospheric density, surface friction, rock formation, storm frequency, lighting conditions, and terrain scale on different planets would alter how individuals move, climb, carry weight, avoid danger, collaborate, and build. Over time, these environmental pressures would not only affect posture and movement mechanisms, but also transform wearable devices, assistive structures, architectural systems, and social organization. The project therefore proposes the idea of a topological regime: beyond law, rules, or social order, a regime can also be understood as a topological structure jointly produced by body, environment, technology, and space.\n\nThe project attempts to use mature topology optimization techniques from engineering workflows as its core generative logic. In this design, morphology generation is redefined as a coupling flow that connects body, task, environment, and structure. The basic methodology is graph → form → state: first, bodily posture, movement paths, force directions, terrain conditions, task demands, and environmental constraints are translated into visual fields, vectors, or graph structures; then, through streamline tracing, skeleton generation, lattice filling, and topological growth, structural candidates are generated; finally, manufacturing constraints and environmental adaptability are evaluated and fed back to form a closed-loop design process.\n\nThe project is progressing toward the Grasshopper / GH Python prototyping stage, involving field construction, IDW interpolation, surface streamline tracing, seed point control, skeleton generation, basic evaluation reports, and manufacturing constraint checks. Later development will continue toward three-dimensional force-flow lattice generation and complex surface stability optimization.\n\nAt the visual and experiential level, Topological Regime builds immersive planetary environments in Unreal Engine, exploring procedural terrain generation, large-scale natural landforms, special weather systems, first-person / third-person body skeleton visualization, and XR experience. The project aims to let viewers perceive a clear causal chain: how planetary conditions reshape terrain, how terrain changes bodily movement, how bodily movement generates new structural forms, and how those forms eventually shape a new mode of survival.",

      function currentProjects() {

      function moduleHtml(module) {
        if (typeof module === "string") {
          return `<section class="module"><p>${module}</p></section>`;
        }

        const title = module.title ? `<h2>${module.title}</h2>` : "";
        if (module.type === "image") {
          return `<section class="module">${title}<img class="mediaAsset" src="${module.src}" alt="${module.title || ""}" /></section>`;
        }

        if (module.type === "video") {
          return `<section class="module">${title}<video class="mediaAsset" controls src="${module.src}"></video></section>`;
        }

        if (module.type === "imageGrid") {
          return `<section class="module">${title}<div class="mediaGrid">${module.images
            .map((src) => `<img class="mediaAsset" src="${src}" alt="${module.title || ""}" />`)
            .join("")}</div></section>`;
        }

        return `<section class="module">${title}<p>${module.body || ""}</p></section>`;
      }

      function splitCvDate(value) {
        const match = value.match(/^(.*?)(\s*\d{4}\.\d+\s*-\s*)$/);

              <div class="cvIntro">
                <img class="cvPhoto" src="${cv.photo}" alt="${cv.name}" />
                <h1 class="cvName">${cv.name}</h1>
                <p class="cvLocation">${state.locale === "zh" ? "广东 广州" : "Guangdong Guangzhou"}</p>
                <p class="cvEmail">${cv.email}</p>
                <p class="cvEducation">${cv.education.join("\n")}</p>
              </div>

              <div class="cvLower">
                ${
                  cv.experience
                    ? `<div class="cvExperience">${cv.experience
                        .map((item) => {
                          const entry = splitCvDate(item);
                          return `<p class="cvExperienceItem"><span>${entry.label}</span><span>${entry.date}</span></p>`;
                        })
                        .join("")}</div>`
                    : ""
                }
                <div class="cvAwards">
                  ${cv.awards.map((award) => `<p class="cvAward">${award}</p>`).join("")}
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderProjects() {
        main.innerHTML = `
          <section class="section projectListSection">
            <h1 class="pageTitle">Projects</h1>
            <div class="projectPreviewList">
              ${currentProjects()
                .map(
                  (project) =>
                    `<a class="projectPreview" aria-label="${project.title}" href="#${state.locale}/${project.slug}" data-route="${project.slug}" data-preview="${project.slug}">${
                      project.cover ? `<img src="${project.cover}" alt="" />` : ""
                    }</a>`
                )
                .join("")}
            </div>
          </section>
        `;
      }

      function renderProject() {
        const project = currentProjects().find((item) => item.slug === state.slug);
        if (!project) {
          state.view = "projects";
          state.slug = "";
          renderProjects();
          return;
        }
        main.innerHTML = `
          <section class="section">
            <div class="projectHeader">
              <h1 class="pageTitle">${project.title}</h1>
              ${project.award ? `<p class="projectAward">${project.award}</p>` : ""}
            </div>
            ${project.subtitle ? `<p class="subtitle">${project.subtitle}</p>` : ""}
            ${project.modules.map(moduleHtml).join("")}
          </section>
        `;
      }

      function render() {
        document.documentElement.lang = state.locale === "zh" ? "zh-CN" : "en";
        syncButtons();
        renderNav();
        if (state.view === "cv") renderCv();
        if (state.view === "projects") renderProjects();
        if (state.view === "project") renderProject();
      }

      function routeFromHash() {
        const raw = window.location.hash.replace("#", "");
        const [maybeLocale, maybeRoute] = raw.split("/");
        state.locale = maybeLocale === "en" ? "en" : "zh";
        state.hoverSlug = "";
        if (!maybeRoute || maybeRoute === "cv") {
          state.view = "cv";
          state.slug = "";
        } else if (maybeRoute === "projects") {
          state.view = "projects";
          state.slug = "";
        } else {
          state.view = "project";
          state.slug = maybeRoute;
        }
        render();
      }

      cvButton.addEventListener("click", () => {
        state.view = "cv";
        state.slug = "";
        state.hoverSlug = "";
        setHash();
        render();
      });

      projectsButton.addEventListener("click", () => {
        state.view = "projects";
        state.slug = "";
        state.hoverSlug = "";
        setHash();
        render();
      });

      zhButton.addEventListener("click", () => {
        state.locale = "zh";
        state.hoverSlug = "";
        setHash();
        render();
      });

      enButton.addEventListener("click", () => {
        state.locale = "en";
        state.hoverSlug = "";
        setHash();
        render();
      });

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-route]");
        if (!target) return;
        state.view = "project";
        state.slug = target.dataset.route;
        state.hoverSlug = "";
        setHash();
        render();
      });

      document.addEventListener("mouseover", (event) => {
        const target = event.target.closest("[data-preview]");
        if (!target) return;
        state.hoverSlug = target.dataset.preview;
        renderNav();
      });

      document.addEventListener("mouseout", (event) => {
        const target = event.target.closest("[data-preview]");
        if (!target) return;
        state.hoverSlug = "";
        renderNav();
      });

      document.addEventListener("focusin", (event) => {
        const target = event.target.closest("[data-preview]");
        if (!target) return;
        state.hoverSlug = target.dataset.preview;
        renderNav();
      });

      document.addEventListener("focusout", (event) => {
        const target = event.target.closest("[data-preview]");
        if (!target) return;
        state.hoverSlug = "";
        renderNav();
      });

      window.addEventListener("hashchange", routeFromHash);
      routeFromHash();
    </script>
  </body>
</html>
